; Aangika one-hand glove: ESP32 DevKit (30-pin), Arduino framework.
; Build:  pio run          Flash:  pio run -t upload          Logs:  pio device monitor
; See docs/GLOVE.md for the pin map, calibration and troubleshooting.

[env:glove]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv      ; BLE + Wi-Fi + portal need >1.2 MB
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    tzapu/WiFiManager@^2.0.17
    links2004/WebSockets@^2.4.1
