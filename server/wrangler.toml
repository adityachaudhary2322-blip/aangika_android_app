# Cloudflare Worker: Aangika's API (Sarvam proxy + community sign dictionary).
# See README.md in this folder.
name = "aangika-api"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Your site's origin(s), comma-separated, in addition to the built-in
# localhost / Android app origins in worker.js.
ALLOWED_ORIGINS = "https://aangika-pwa02.onrender.com"
RATE_PER_MIN = "30"
# Google sign-in (auth.js): the OAuth WEB client id(s) whose ID tokens are
# accepted. Not a secret. The Android app signs in with this same web id.
GOOGLE_CLIENT_IDS = "580018307108-ra5vrfv8oi7tejr90fr8f8qock11t6o8.apps.googleusercontent.com"

# Community sign dictionary storage. Create it once and paste the id here:
#   npx wrangler kv namespace create DICT
[[kv_namespaces]]
binding = "DICT"
id = "38f7b9ebefba41b8a043bf8b0534856c"

# SECRETS, never written here:
#   npx wrangler secret put SARVAM_API_KEY    (your Sarvam key)
#   npx wrangler secret put DEV_CODE          (the developer code for publishing signs)
