// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // @capgo/capacitor-social-login asks for androidx.browser 1.9.0 (Apple
    // sign-in, not used here), which needs compileSdk 36 / AGP 8.9.1, while its
    // own androidbrowserhelper pins 1.4.0. One version for everything: 1.8.0
    // works with this project's compileSdk 35. Google sign-in does not use it.
    configurations.configureEach {
        resolutionStrategy.force 'androidx.browser:browser:1.8.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
