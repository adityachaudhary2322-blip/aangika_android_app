<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; margin: 0; padding: 14px; background: #0B1326;
           color: #DAE2FD; font: 13px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 15px; }
    p { margin: 0 0 10px; font-size: 11px; color: #BBCAAF; }
    code { background: #222A3D; padding: 1px 4px; border-radius: 4px; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4EDEA3; }
  </style>
</head>
<body>
  <h1>ISL Connect</h1>
  <p>Captions overlay for meetings.</p>
  <div class="row"><span class="dot"></span><span>Active on Meet, Zoom, WhatsApp Web</span></div>
  <p style="margin-top:10px">
    The HUD appears bottom-right on a supported call. Drag it anywhere.
  </p>
</body>
</html>
