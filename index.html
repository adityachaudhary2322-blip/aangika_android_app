<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0B14" />
    <title>Aangika — Sign Language Translator</title>
    <meta name="description" content="Indian Sign Language (and ASL for international users) to speech, speech to text, and signed video calls. By team HealX." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aangika" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,0..100&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <script>
      /*
       * Paint the theme BEFORE React exists.
       *
       * ThemeProvider applies the class from an effect, which runs after first
       * paint -- so without this a dark-mode user gets a full white flash on
       * every cold load, and a light-mode user gets a navy one. This is the one
       * place outside ThemeContext allowed to touch the class; the provider
       * reads it back on mount so the two never disagree.
       */
      (function () {
        try {
          var saved = localStorage.getItem('app_theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          // New users start on the Lagoon palette in the glass style.
          var palette = localStorage.getItem('app_palette') || 'lagoon';
          if (palette !== 'iris' && palette !== 'custom') {
            document.documentElement.setAttribute('data-palette', palette);
          }
          document.documentElement.setAttribute(
            'data-style', localStorage.getItem('app_style') === 'classic' ? 'classic' : 'glass'
          );
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0C0B14' : '#F7F6FB');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
