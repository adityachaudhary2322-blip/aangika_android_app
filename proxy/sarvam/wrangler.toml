# Cloudflare Worker: Aangika's Sarvam proxy. See README.md in this folder.
name = "aangika-sarvam"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Your site's origin(s), comma-separated, in addition to the built-in
# localhost / Android app origins in worker.js.
ALLOWED_ORIGINS = "https://isl-connect.onrender.com"
RATE_PER_MIN = "30"

# The Sarvam key is a SECRET, never written here:
#   npx wrangler secret put SARVAM_API_KEY
